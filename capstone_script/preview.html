<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Plan Preview</title>
<style>
  :root {
    --bg: #f3f4f7; --card: #ffffff; --ink: #1d2433; --muted: #5b6475;
    --accent: #2f6fde; --accent-soft: #e4edfc; --line: #d6dae2; --caption: rgba(29, 36, 51, .88);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--card); border-radius: 14px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .08); overflow: hidden; container-type: inline-size; }
  .slide { position: absolute; inset: 0; padding: 5cqw 7cqw 15cqw; display: flex; flex-direction: column;
          gap: calc(1.8cqw * var(--fit, 1)); }
  .template { font-size: calc(1.4cqw * var(--fit, 1)); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .slide h2 { margin: 0; font-size: calc(3.8cqw * var(--fit, 1)); line-height: 1.15; }
  .statement { margin: 0; font-size: calc(2.4cqw * var(--fit, 1)); line-height: 1.35; color: var(--muted); }
  .points { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 1.6cqw;
            margin: .8cqw 0 0; padding: 0; list-style: none; }
  .points li { font-size: calc(2.1cqw * var(--fit, 1)); line-height: 1.3; padding: calc(1.6cqw * var(--fit, 1)) 1.8cqw; border-radius: 1.2cqw;
               background: var(--bg); border: .25cqw solid transparent;
               transition: background .25s, border-color .25s, color .25s; }
  .flow { flex: 1; display: flex; align-items: center; justify-content: center; gap: 1.4cqw; }
  .node { flex: 0 1 20cqw; text-align: center; font-size: calc(2.4cqw * var(--fit, 1)); font-weight: 600;
          padding: calc(3cqw * var(--fit, 1)) 1.4cqw;
          border-radius: 1.4cqw; background: var(--bg); border: .25cqw solid var(--line);
          transition: background .25s, border-color .25s, color .25s, transform .25s; }
  .arrow { font-size: 3.2cqw; color: var(--muted); }
  .points li.on, .node.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .node.on { transform: translateY(-.6cqw); }
  .subtitle { position: absolute; left: 6cqw; right: 6cqw; bottom: 3.2cqw; text-align: center;
              font-size: 2.3cqw; line-height: 1.35; padding: 1.1cqw 2cqw; border-radius: 1cqw;
              background: var(--caption); color: #fff; }
  .subtitle:empty { display: none; }
  .controls { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  audio { width: 100%; }
  .scenes { display: flex; flex-wrap: wrap; gap: 8px; }
  .scenes button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
                   border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .scenes button.on { border-color: var(--accent); color: var(--accent); }
  .meta { margin: 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p id="summary"></p></header>
  <div class="stage"><div class="slide" id="slide"></div><div class="subtitle" id="subtitle"></div></div>
  <div class="controls">
    <audio id="audio" controls preload="auto"></audio>
    <div class="scenes" id="scenes"></div>
    <p class="meta">Script and narration preview. Pauses are fixed for listening; the final video uses the frame-accurate timeline and renderer.</p>
  </div>
</main>
<script id="preview-data" type="application/json">__PREVIEW_DATA__</script>
<script>
const data = JSON.parse(document.getElementById("preview-data").textContent);
const audio = document.getElementById("audio");
const slide = document.getElementById("slide");
const subtitle = document.getElementById("subtitle");
const sceneButtons = document.getElementById("scenes");
audio.src = data.audio;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const lines = new Map();
data.plan.scenes.forEach(scene => scene.narration.forEach(line => lines.set(line.id, line)));
const chapters = data.plan.chapters || [];
const chapterOf = new Map();
chapters.forEach((chapter, c) =>
  chapter.sceneIds.forEach(id => chapterOf.set(id, `Chapter ${c + 1}: ${chapter.title}`)));
const ranges = data.plan.scenes.map(scene => {
  const blocks = data.blocks.filter(block => block.sceneId === scene.id);
  const last = blocks[blocks.length - 1];
  return { scene, blocks, start: Math.max(0, blocks[0].previewStartSeconds - data.lead),
           end: last.previewStartSeconds + last.durationSeconds + data.tail };
});

document.getElementById("title").textContent = data.plan.title;
document.getElementById("summary").textContent = (chapters.length ? `${chapters.length} chapters · ` : "")
  + `${ranges.length} scenes · ${data.blocks.length} narration lines · ${data.speechSeconds.toFixed(1)} s of speech`;

ranges.forEach((range, index) => {
  const button = el("button", "", `${index + 1}. ${range.scene.visual.title}`);
  button.title = chapterOf.get(range.scene.id) || "";
  button.addEventListener("click", () => { audio.currentTime = range.start + 0.001; update(); });
  sceneButtons.append(button);
});

let shownScene = null;
function drawScene(scene) {
  const label = chapterOf.has(scene.id) ? `${chapterOf.get(scene.id)} · ${scene.template}` : scene.template;
  slide.replaceChildren(el("div", "template", label), el("h2", "", scene.visual.title));
  if (scene.template === "concept") {
    slide.append(el("p", "statement", scene.visual.statement));
    const list = el("ul", "points");
    (scene.visual.points || []).forEach((point, i) => {
      const item = el("li", "", point);
      item.dataset.index = i;
      list.append(item);
    });
    slide.append(list);
  } else {
    const flow = el("div", "flow");
    scene.visual.nodes.forEach((node, i) => {
      if (i) flow.append(el("span", "arrow", "→"));
      const box = el("div", "node", node.label);
      box.dataset.id = node.id;
      flow.append(box);
    });
    slide.append(flow);
  }
  shownScene = scene.id;
  fit();
  [...sceneButtons.children].forEach((button, i) => button.classList.toggle("on", ranges[i].scene.id === scene.id));
}

// Shrink long slide text until it clears the subtitle band.
function fit() {
  for (let scale = 1; scale >= 0.6; scale -= 0.05) {
    slide.style.setProperty("--fit", scale.toFixed(2));
    if (slide.scrollHeight <= slide.clientHeight) break;
  }
}

function update() {
  const t = audio.currentTime;
  const range = ranges.find(r => t < r.end) || ranges[ranges.length - 1];
  if (range.scene.id !== shownScene) drawScene(range.scene);
  const spoken = range.blocks.filter(block => block.previewStartSeconds <= t);
  const recent = spoken[spoken.length - 1];
  const speaking = recent && t < recent.previewStartSeconds + recent.durationSeconds ? recent : null;
  subtitle.textContent = speaking ? speaking.text : "";
  const line = recent ? lines.get(recent.narrationId) : null;
  slide.querySelectorAll(".points li").forEach(item =>
    item.classList.toggle("on", line !== null && Number(item.dataset.index) === line.highlightPointIndex));
  slide.querySelectorAll(".node").forEach(box =>
    box.classList.toggle("on", line !== null && box.dataset.id === line.highlightNodeId));
}

function tick() { update(); if (!audio.paused) requestAnimationFrame(tick); }
audio.addEventListener("play", tick);
audio.addEventListener("seeked", update);
audio.addEventListener("timeupdate", update);
window.addEventListener("resize", fit);
update();
</script>
</body>
</html>
