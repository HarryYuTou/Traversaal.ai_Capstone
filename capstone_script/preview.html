<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Plan Preview</title>
<style>
  :root {
    --bg: #f3f4f7; --card: #ffffff; --ink: #1d2433; --muted: #5b6475;
    --accent: #2f6fde; --accent-soft: #e4edfc; --line: #d6dae2; --caption: rgba(29, 36, 51, .88);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--card); border-radius: 14px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .08); overflow: hidden; container-type: inline-size; }
  .slide { position: absolute; inset: 0; padding: 5cqw 7cqw 15cqw; display: flex; flex-direction: column;
          gap: calc(1.8cqw * var(--fit, 1)); }
  .template { font-size: calc(1.4cqw * var(--fit, 1)); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .slide h2 { margin: 0; font-size: calc(3.8cqw * var(--fit, 1)); line-height: 1.15; }
  .statement { margin: 0; font-size: calc(2.4cqw * var(--fit, 1)); line-height: 1.35; color: var(--muted); }
  .points { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 1.6cqw;
            margin: .8cqw 0 0; padding: 0; list-style: none; }
  .points li { font-size: calc(2.1cqw * var(--fit, 1)); line-height: 1.3; padding: calc(1.6cqw * var(--fit, 1)) 1.8cqw; border-radius: 1.2cqw;
               background: var(--bg); border: .25cqw solid transparent;
               transition: background .25s, border-color .25s, color .25s; }
  .flow { flex: 1; display: flex; align-items: center; justify-content: center; gap: 1.4cqw; }
  .node { flex: 0 1 20cqw; text-align: center; font-size: calc(2.4cqw * var(--fit, 1)); font-weight: 600;
          padding: calc(3cqw * var(--fit, 1)) 1.4cqw;
          border-radius: 1.4cqw; background: var(--bg); border: .25cqw solid var(--line);
          transition: background .25s, border-color .25s, color .25s, transform .25s; }
  .arrow { font-size: 3.2cqw; color: var(--muted); }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; margin-top: .8cqw; }
  .column { padding: calc(1.6cqw * var(--fit, 1)) 2cqw; border-radius: 1.2cqw; background: var(--bg);
            border: .25cqw solid transparent; transition: background .25s, border-color .25s; }
  .column h3 { margin: 0 0 .8cqw; font-size: calc(2.4cqw * var(--fit, 1)); }
  .column ul { margin: 0; padding-left: 1.3em; font-size: calc(2cqw * var(--fit, 1)); line-height: 1.35; }
  .definition { display: flex; flex-direction: column; gap: 1cqw; margin-top: .4cqw; }
  .definition p { margin: 0; padding: .7cqw 1.4cqw; border-radius: 1cqw; border: .25cqw solid transparent;
                  transition: background .25s, border-color .25s; }
  .term { font-size: calc(3.4cqw * var(--fit, 1)); font-weight: 700; color: var(--accent); }
  .meaning { font-size: calc(2.4cqw * var(--fit, 1)); line-height: 1.35; }
  .example { font-size: calc(2cqw * var(--fit, 1)); line-height: 1.35; color: var(--muted); }
  .points li.on, .node.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .events, .stats { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1.4cqw;
                    align-items: center; text-align: center; }
  .event, .stat { padding: 1.2cqw; border-radius: 1.2cqw; border: .25cqw solid transparent;
                  transition: background .25s, border-color .25s, color .25s; }
  .event b { display: block; font-size: calc(3.2cqw * var(--fit, 1)); }
  .stat b { display: block; font-size: calc(6cqw * var(--fit, 1)); line-height: 1.1; }
  .event span, .stat span { font-size: calc(1.9cqw * var(--fit, 1)); line-height: 1.3; color: var(--muted); }
  .note, .credit small { font-size: calc(1.6cqw * var(--fit, 1)); color: var(--muted); font-style: italic; }
  .quote { margin: 0; font-family: Georgia, "Times New Roman", serif; font-style: italic; line-height: 1.3;
           font-size: calc(3cqw * var(--fit, 1)); padding: 1cqw 1.6cqw; border-radius: 1.2cqw;
           border: .25cqw solid transparent; transition: background .25s, border-color .25s; }
  .credit { font-size: calc(2.1cqw * var(--fit, 1)); font-weight: 700; color: var(--accent); }
  .credit small { display: block; font-weight: 400; }
  .map-items { display: flex; flex-wrap: wrap; gap: 1cqw; margin: .6cqw 0 0; padding: 0; list-style: none; }
  .map-items li { font-size: calc(2cqw * var(--fit, 1)); padding: .8cqw 1.4cqw; border-radius: 1cqw; background: var(--bg);
                  border: .25cqw solid transparent; transition: background .25s, border-color .25s, color .25s; }
  .map-items li small { color: var(--muted); }
  .event.on, .stat.on, .map-items li.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .quote.on { background: var(--accent-soft); border-color: var(--accent); }
  .column.on, .definition p.on { background: var(--accent-soft); border-color: var(--accent); }
  .node.on { transform: translateY(-.6cqw); }
  .subtitle { position: absolute; left: 6cqw; right: 6cqw; bottom: 3.2cqw; text-align: center;
              font-size: 2.3cqw; line-height: 1.35; padding: 1.1cqw 2cqw; border-radius: 1cqw;
              background: var(--caption); color: #fff; }
  .subtitle:empty { display: none; }
  .controls { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  audio { width: 100%; }
  .scenes { display: flex; flex-wrap: wrap; gap: 8px; }
  .scenes button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
                   border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .scenes button.on { border-color: var(--accent); color: var(--accent); }
  .meta { margin: 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p id="summary"></p></header>
  <div class="stage"><div class="slide" id="slide"></div><div class="subtitle" id="subtitle"></div></div>
  <div class="controls">
    <audio id="audio" controls preload="auto"></audio>
    <div class="scenes" id="scenes"></div>
    <p class="meta">Script and narration preview. Pauses are fixed for listening; the final video uses the frame-accurate timeline and renderer.</p>
  </div>
</main>
<script id="preview-data" type="application/json">__PREVIEW_DATA__</script>
<script>
const data = JSON.parse(document.getElementById("preview-data").textContent);
const audio = document.getElementById("audio");
const slide = document.getElementById("slide");
const subtitle = document.getElementById("subtitle");
const sceneButtons = document.getElementById("scenes");
audio.src = data.audio;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const lines = new Map();
data.plan.scenes.forEach(scene => scene.narration.forEach(line => lines.set(line.id, line)));
const chapters = data.plan.chapters || [];
const chapterOf = new Map();
chapters.forEach((chapter, c) =>
  chapter.sceneIds.forEach(id => chapterOf.set(id, `Chapter ${c + 1}: ${chapter.title}`)));
const ranges = data.plan.scenes.map(scene => {
  const blocks = data.blocks.filter(block => block.sceneId === scene.id);
  const last = blocks[blocks.length - 1];
  return { scene, blocks, start: Math.max(0, blocks[0].previewStartSeconds - data.lead),
           end: last.previewStartSeconds + last.durationSeconds + data.tail };
});

document.getElementById("title").textContent = data.plan.title;
document.getElementById("summary").textContent = (chapters.length ? `${chapters.length} chapters · ` : "")
  + `${ranges.length} scenes · ${data.blocks.length} narration lines · ${data.speechSeconds.toFixed(1)} s of speech`;

ranges.forEach((range, index) => {
  const button = el("button", "", `${index + 1}. ${range.scene.visual.title}`);
  button.title = chapterOf.get(range.scene.id) || "";
  button.addEventListener("click", () => { audio.currentTime = range.start + 0.001; update(); });
  sceneButtons.append(button);
});

let shownScene = null;
function drawScene(scene) {
  const label = chapterOf.has(scene.id) ? `${chapterOf.get(scene.id)} · ${scene.template}` : scene.template;
  slide.replaceChildren(el("div", "template", label), el("h2", "", scene.visual.title));
  if (scene.template === "concept") {
    slide.append(el("p", "statement", scene.visual.statement));
    const list = el("ul", "points");
    (scene.visual.points || []).forEach((point, i) => {
      const item = el("li", "", point);
      item.dataset.index = i;
      list.append(item);
    });
    slide.append(list);
  } else if (scene.template === "flow") {
    const flow = el("div", "flow");
    scene.visual.nodes.forEach((node, i) => {
      if (i) flow.append(el("span", "arrow", "→"));
      const box = el("div", "node", node.label);
      box.dataset.id = node.id;
      flow.append(box);
    });
    slide.append(flow);
  } else if (scene.template === "comparison") {
    const columns = el("div", "columns");
    ["left", "right"].forEach(side => {
      const column = el("div", "column");
      column.dataset.side = side;
      const list = el("ul");
      scene.visual[side].points.forEach(point => list.append(el("li", "", point)));
      column.append(el("h3", "", scene.visual[side].label), list);
      columns.append(column);
    });
    slide.append(columns);
  } else if (scene.template === "definition") {
    const card = el("div", "definition");
    const parts = [["term", scene.visual.term], ["meaning", scene.visual.definition, "definition"]];
    if (scene.visual.example) parts.push(["example", `For example: ${scene.visual.example}`]);
    parts.forEach(([className, text, part]) => {
      const node = el("p", className, text);
      node.dataset.part = part || className;
      card.append(node);
    });
    slide.append(card);
  } else if (scene.template === "timeline") {
    const events = el("div", "events");
    scene.visual.events.forEach(event => {
      const box = el("div", "event");
      box.dataset.id = event.id;
      box.append(el("b", "", event.date), el("span", "", event.label));
      events.append(box);
    });
    slide.append(events);
  } else if (scene.template === "stat") {
    const stats = el("div", "stats");
    scene.visual.stats.forEach((stat, i) => {
      const box = el("div", "stat");
      box.dataset.index = i;
      const number = stat.value.toLocaleString("en-US");
      box.append(el("b", "", `${stat.prefix || ""}${number}${stat.unit ? " " + stat.unit : ""}`),
                 el("span", "", stat.label));
      stats.append(box);
    });
    slide.append(stats);
    if (scene.visual.note) slide.append(el("p", "note", scene.visual.note));
  } else if (scene.template === "quote") {
    const credit = el("div", "credit", `— ${scene.visual.author}`);
    if (scene.visual.context) credit.append(el("small", "", scene.visual.context));
    slide.append(el("p", "quote", `“${scene.visual.quote}”`), credit);
  } else if (scene.template === "map") {
    slide.append(el("p", "statement", `Map: ${scene.visual.region}${scene.visual.route ? ", with a route" : ""}`));
    const items = el("ul", "map-items");
    scene.visual.areas.forEach(area => {
      const item = el("li", "", area.label + " ");
      item.dataset.id = area.id;
      item.append(el("small", "", area.countries.join(", ")));
      items.append(item);
    });
    scene.visual.places.forEach(place => {
      const item = el("li", "", `● ${place.label}`);
      item.dataset.id = place.id;
      items.append(item);
    });
    slide.append(items);
  }
  shownScene = scene.id;
  fit();
  [...sceneButtons.children].forEach((button, i) => button.classList.toggle("on", ranges[i].scene.id === scene.id));
}

// Shrink long slide text until it clears the subtitle band.
function fit() {
  for (let scale = 1; scale >= 0.6; scale -= 0.05) {
    slide.style.setProperty("--fit", scale.toFixed(2));
    if (slide.scrollHeight <= slide.clientHeight) break;
  }
}

function update() {
  const t = audio.currentTime;
  const range = ranges.find(r => t < r.end) || ranges[ranges.length - 1];
  if (range.scene.id !== shownScene) drawScene(range.scene);
  const spoken = range.blocks.filter(block => block.previewStartSeconds <= t);
  const recent = spoken[spoken.length - 1];
  const speaking = recent && t < recent.previewStartSeconds + recent.durationSeconds ? recent : null;
  subtitle.textContent = speaking ? speaking.text : "";
  const line = recent ? lines.get(recent.narrationId) : null;
  slide.querySelectorAll(".points li").forEach(item =>
    item.classList.toggle("on", line !== null && Number(item.dataset.index) === line.highlightPointIndex));
  slide.querySelectorAll(".node").forEach(box =>
    box.classList.toggle("on", line !== null && box.dataset.id === line.highlightNodeId));
  slide.querySelectorAll(".column").forEach(column =>
    column.classList.toggle("on", line !== null && column.dataset.side === line.highlightSide));
  slide.querySelectorAll(".definition p").forEach(part =>
    part.classList.toggle("on", line !== null && part.dataset.part === line.highlightPart));
  slide.querySelectorAll(".event").forEach(box =>
    box.classList.toggle("on", line !== null && box.dataset.id === line.highlightEventId));
  slide.querySelectorAll(".stat").forEach(box =>
    box.classList.toggle("on", line !== null && Number(box.dataset.index) === line.highlightStatIndex));
  slide.querySelectorAll(".quote").forEach(quote =>
    quote.classList.toggle("on", line !== null && line.highlightQuote === true));
  slide.querySelectorAll(".map-items li").forEach(item =>
    item.classList.toggle("on", line !== null && item.dataset.id === line.highlightId));
}

function tick() { update(); if (!audio.paused) requestAnimationFrame(tick); }
audio.addEventListener("play", tick);
audio.addEventListener("seeked", update);
audio.addEventListener("timeupdate", update);
window.addEventListener("resize", fit);
update();
</script>
</body>
</html>
